name: Auto Create APK Build Files

on:
  workflow_dispatch: # Allows you to run this with one click

jobs:
  create-files:
    runs-on: ubuntu-24.04 # Pinned OS version to prevent virtual machine provisioning loops
    permissions:
      contents: write # Gives the script permission to commit files to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Directories and App Files
        run: |
          # 1. Create the GitHub Actions workflow directory for the compiler
          mkdir -p .github/workflows

          # 2. Automatically generate the main.py mobile GUI file
          cat << 'EOF' > main.py
          import os
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.button import Button
          from kivy.uix.textinput import TextInput
          from kivy.uix.label import Label
          from kivy.uix.scrollview import ScrollView
          from OpenBullet import OpenBullet

          class OpenBulletMobileUI(BoxLayout):
              def __init__(self, **kwargs):
                  super().__init__(orientation='vertical', padding=15, spacing=10, **kwargs)
                  self.add_widget(Label(text="OpenBullet To Python Android Wrapper", font_size='18sp', size_hint_y=0.08))
                  self.add_widget(Label(text="LoliScript Config Input:", size_hint_y=0.05))
                  self.config_input = TextInput(
                      text='REQUEST GET "https://google.com"\nKEYCHECK KEYCHAIN Success OR KEY "title>Google"',
                      multiline=True, size_hint_y=0.25
                  )
                  self.add_widget(self.config_input)
                  self.cred_layout = BoxLayout(orientation='horizontal', size_hint_y=0.08, spacing=10)
                  self.user_input = TextInput(text='username', hint_text='Username', multiline=False)
                  self.pass_input = TextInput(text='password', hint_text='Password', password=True, multiline=False)
                  self.cred_layout.add(self.user_input)
                  self.cred_layout.add(self.pass_input)
                  self.add_widget(self.cred_layout)
                  self.run_btn = Button(text="EXECUTE CONFIG", size_hint_y=0.1, background_color=(0.1, 0.6, 0.8, 1))
                  self.run_btn.bind(on_press=self.execute_config)
                  self.add_widget(self.run_btn)
                  self.add_widget(Label(text="Console Output Logs:", size_hint_y=0.05))
                  self.scroll = ScrollView(size_hint_y=0.39)
                  self.output_log = Label(text="System online. Awaiting execution...\n", size_hint_y=None, halign='left', valign='top')
                  self.output_log.bind(texture_size=self.output_log.setter('size'))
                  self.scroll.add_widget(self.output_log)
                  self.add_widget(self.scroll)

              def execute_config(self, instance):
                  config_text = self.config_input.text
                  username = self.user_input.text
                  password = self.pass_input.text
                  self.output_log.text += f"\n>>> Testing account session for: {username}"
                  try:
                      ob = OpenBullet(config=config_text, USER=username, PASS=password)
                      result = ob.run()
                      self.output_log.text += f"\n>>> PARSE SUCCESS: {str(result)}"
                  except Exception as e:
                      self.output_log.text += f"\n>>> PARSE FAILED: {str(e)}"

          class OpenBulletApp(App):
              def build(self): return OpenBulletMobileUI()

          if __name__ == '__main__':
              OpenBulletApp().run()
          EOF

          # 3. Automatically generate the buildozer.spec Android configuration manifest
          cat << 'EOF' > buildozer.spec
          [app]
          title = OBToPython
          package.name = obtopython
          package.domain = org.categorically
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 1.0.0
          requirements = python3,kivy,requests,urllib3,idna,certifi,charset-normalizer
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          android.ndk = 25b
          android.ndk_api = 21
          android.private_storage = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

          # 4. Automatically generate the fixed compiler engine script
          cat << 'EOF' > .github/workflows/build-apk.yml
          name: Build Android APK
          on:
            workflow_run:
              workflows: ["Auto Create APK Build Files"]
              types: [completed]
            workflow_dispatch:
          jobs:
            build:
              runs-on: ubuntu-24.04
              steps:
                - name: Checkout Repository
                  uses: actions/checkout@v4
                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.10'
                - name: Install System Dependencies
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstreamer-plugins-base1.0-dev libasound2-dev libjack-jackd2-dev libpulse-dev openjdk-17-jdk unzip zip
                - name: Install Buildozer and Cython
                  run: |
                    pip install --upgrade pip
                    pip install buildozer cython==0.29.36
                - name: Build APK with Buildozer
                  run: |
                    # The absolute fix: force 'yes' to license queries, show full verbose logs (-v)
                    yes | buildozer -v android debug
                - name: Upload APK Artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: OpenBulletToPython-APK
                    path: bin/*.apk
          EOF

      - name: Commit and Push Changes back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add main.py buildozer.spec .github/workflows/build-apk.yml
          git commit -m "Automated setup: Mobile UI, config manifest, and APK builder injected"
          git push
          
